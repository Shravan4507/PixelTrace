name: Release Standalone Executable & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup Compiler
        run: choco install innosetup --yes --no-progress

      - name: Build Frontend Assets
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Run Test Verification
        run: |
          python -m pytest tests -v

      - name: Compile Standalone Executable & Setup Installer
        run: |
          python scripts/build_exe.py

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/PixelTrace-Setup.exe
            dist/PixelTrace.exe
          name: PixelTrace ${{ github.ref_name || 'v1.0.0' }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### PixelTrace — Digital Image Forensics Workstation

            **Official Windows Release**

            #### Installation Options:
            1. **`PixelTrace-Setup.exe` (Recommended Installer)**:
               - Standard Windows Installation Wizard.
               - Installs cleanly to `%LocalAppData%\Programs\PixelTrace` (requires zero administrative/UAC elevation).
               - Creates Desktop Shortcut with custom high-res forensic emblem icon.
               - Creates Windows Start Menu shortcut and registers in Windows "Installed apps" for easy uninstallation.
               - Launches the workstation in dedicated desktop app mode (no browser clutter).

            2. **`PixelTrace.exe` (Standalone Portable Binary)**:
               - Zero-install portable single-file binary.
               - Runs completely offline/airgapped in standalone desktop window mode.

            #### Forensic Analysis Engine:
            - **EXIF Metadata Inspection**: High-precision GPS conversion, sensitive location warnings, camera & exposure telemetry.
            - **Cryptographic Fingerprinting**: 64 KB streaming SHA-256 and MD5 digests.
            - **Error Level Analysis (ELA)**: Controlled JPEG recompression and regional variance metrics.
            - **Dual-Evidence Comparative Workspace**: Pixel-by-pixel MSE comparison and dimensional difference detection.
            - **Formal PDF Reporting**: ReportLab engine with embedded D-DIN typography.
